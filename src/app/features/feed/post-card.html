@let p = post();
<article class="post">
  <app-avatar [name]="p.author.name" [hue]="p.author.hue" [size]="44" />

  <div class="post__body">
    <header class="post__head">
      <strong>{{ p.author.name }}</strong>
      <span class="post__meta">&#64;{{ p.author.handle }} · {{ p.createdAt | timeAgo }}</span>
      @if (own()) {
        <button
          type="button"
          class="btn btn--ghost btn--icon btn--sm post__more"
          aria-label="Eliminar publicación"
          title="Eliminar"
          (click)="remove.emit()"
        >
          <app-icon name="trash" [size]="16" />
        </button>
      }
    </header>

    <p class="post__text">{{ p.content }}</p>

    @if (p.tags.length) {
      <ul class="post__tags" role="list">
        @for (tag of p.tags; track tag) {
          <li>#{{ tag }}</li>
        }
      </ul>
    }

    <footer class="post__actions">
      <button
        type="button"
        class="action action--like"
        [class.is-on]="liked()"
        [attr.aria-pressed]="liked()"
        aria-label="Me gusta"
        (click)="like.emit()"
      >
        <app-icon name="heart" [size]="18" [filled]="liked()" /> {{ p.likedBy.length }}
      </button>
      <button
        type="button"
        class="action action--ai"
        aria-label="Preguntar a un agente sobre esta publicación"
        (click)="ask.emit()"
      >
        <app-icon name="sparkles" [size]="18" /> <span class="action__label">Preguntar</span>
      </button>
      <span class="spacer"></span>
      <button
        type="button"
        class="action"
        [class.is-on]="saved()"
        [attr.aria-pressed]="saved()"
        aria-label="Guardar"
        (click)="save.emit()"
      >
        <app-icon name="bookmark" [size]="18" [filled]="saved()" />
      </button>
    </footer>
  </div>
</article>
