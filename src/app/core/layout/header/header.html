<div class="topbar">
  <div class="container topbar__inner">
    <a routerLink="/" class="brand" aria-label="LA RED, ir al inicio">
      <img src="images/chapulin.gif" alt="" class="brand__logo" width="56" height="48" />
      <span class="brand__name">LA RED</span>
    </a>

    <div class="topbar__actions">
      <button
        type="button"
        class="icon-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Activar tema claro' : 'Activar tema oscuro'"
      >
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
        }
      </button>

      <button
        type="button"
        class="icon-btn menu-toggle"
        (click)="toggleMobile()"
        [attr.aria-expanded]="mobileOpen()"
        aria-controls="main-nav"
        [attr.aria-label]="mobileOpen() ? 'Cerrar menú' : 'Abrir menú'"
      >
        @if (mobileOpen()) {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        }
      </button>
    </div>
  </div>
</div>

<nav id="main-nav" class="nav" [class.nav--open]="mobileOpen()" aria-label="Menú principal">
  <ul class="container nav__list" role="list">
    @for (item of menu; track item.path) {
      <li class="nav__item" [class.nav__item--open]="openSubmenu() === item.path">
        @if (item.children?.length) {
          <div class="nav__row">
            <a class="nav__link" [routerLink]="item.path" routerLinkActive="nav__link--active">{{
              item.label
            }}</a>
            <button
              type="button"
              class="nav__caret"
              (click)="toggleSubmenu(item.path)"
              [attr.aria-expanded]="openSubmenu() === item.path"
              [attr.aria-label]="'Mostrar submenú de ' + item.label"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </button>
          </div>
          <ul class="submenu" role="list">
            @for (child of item.children; track child.path) {
              <li>
                <a
                  class="submenu__link"
                  [routerLink]="child.path"
                  routerLinkActive="submenu__link--active"
                  >{{ child.label }}</a
                >
              </li>
            }
          </ul>
        } @else {
          <a
            class="nav__link"
            [routerLink]="item.path"
            routerLinkActive="nav__link--active"
            [routerLinkActiveOptions]="{ exact: true }"
            >{{ item.label }}</a
          >
        }
      </li>
    }
  </ul>
</nav>
